plugins {
    id 'net.fabricmc.fabric-loom'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', '../common/src/main/java']
            exclude 'com/pockyl/handson_delight/compat/jei/**'
            exclude 'com/pockyl/handson_delight/compat/emi/**'
            exclude 'com/pockyl/handson_delight/fabric/rei/**'
            exclude 'com/pockyl/handson_delight/fabric/Fabric*Tests.java'
            exclude 'com/pockyl/handson_delight/gametest/**'
            exclude 'com/pockyl/handson_delight/mixin/KegMixin.java'
            exclude 'com/pockyl/handson_delight/mixin/OvenMixin.java'
            exclude 'com/pockyl/handson_delight/mixin/DecoratedBoardMixin.java'
            exclude 'com/pockyl/handson_delight/mixin/DecoratedBoardContentMixin.java'
            exclude 'com/pockyl/handson_delight/mixin/VatMixin.java'
            exclude 'com/pockyl/handson_delight/mixin/VatUprightMixin.java'
            exclude 'com/pockyl/handson_delight/mixin/VatSparksMixin.java'
            exclude 'com/pockyl/handson_delight/mixin/GrillSmokeMixin.java'
            exclude 'com/pockyl/handson_delight/mixin/GrillSizzleMixin.java'
            exclude 'com/pockyl/handson_delight/mixin/AddonStoveSmokeMixin.java'
            exclude 'com/pockyl/handson_delight/mixin/CuttingBoardBlockMixin.java'
            exclude 'com/pockyl/handson_delight/mixin/MinecraftAccessor.java'
            exclude 'com/pockyl/handson_delight/mixin/RecipeManagerAccessor.java'
            // Third-party 1.21.1-only addon stations not available on 26.3
            exclude 'com/pockyl/handson_delight/client/*Basin*'
            exclude 'com/pockyl/handson_delight/client/*Cuisine*'
            exclude 'com/pockyl/handson_delight/client/*Grill*'
            exclude 'com/pockyl/handson_delight/client/*Keg*'
            exclude 'com/pockyl/handson_delight/client/*Kettle*'
            exclude 'com/pockyl/handson_delight/client/*Oven*'
            exclude 'com/pockyl/handson_delight/client/*Steamer*'
            exclude 'com/pockyl/handson_delight/client/*Vat*'
            exclude 'com/pockyl/handson_delight/client/*Youkai*'
            exclude 'com/pockyl/handson_delight/station/*Basin*'
            exclude 'com/pockyl/handson_delight/station/*Cuisine*'
            exclude 'com/pockyl/handson_delight/station/GrillLogic.java'
            exclude 'com/pockyl/handson_delight/station/GrillStation.java'
            exclude 'com/pockyl/handson_delight/station/KitchenGrill.java'
            exclude 'com/pockyl/handson_delight/station/*Keg*'
            exclude 'com/pockyl/handson_delight/station/*Kettle*'
            exclude 'com/pockyl/handson_delight/station/*Oven*'
            exclude 'com/pockyl/handson_delight/station/*Steamer*'
            exclude 'com/pockyl/handson_delight/station/*Vat*'
            exclude 'com/pockyl/handson_delight/station/*Youkai*'
        }
        resources {
            srcDirs = ['src/main/resources', '../common/src/main/resources']
        }
    }
    devtest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation files('../../diegesis/fabric/build/libs/diegesis-fabric-26.3-1.0.0-beta.12+26.3.jar')
    implementation files('../../reference/FarmersDelight-26.3-3.6.30+refabricated.jar')
}

loom {
    accessWidenerPath = file('src/main/resources/handson_delight.accesswidener')
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        "${mod_id}_devtest" {
            sourceSet sourceSets.devtest
        }
    }
    runs {
        client {
            client()
            configName = 'Fabric Client'
            ideConfigGenerated(true)
            runDir('run')
            source(sourceSets.devtest)
            programArgs('--quickPlaySingleplayer', 'TestHandsOn', '--width', '1280', '--height', '720', '--username', 'Dev')
            vmArg('-Dhandson_delight.devtest=true')
        }
        server {
            server()
            configName = 'Fabric Server'
            ideConfigGenerated(true)
            runDir('run-server')
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-Xmaxerrs', '1000']
}

tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            fabric_loader_version  : fabric_loader_min_version,
            fabric_api_version     : fabric_api_min_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_url                : mod_url,
            farmers_delight_version: farmers_delight_refabricated_min_version,
            diegesis_version       : diegesis_min_version,
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.named('sourcesJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.file('LICENSE')) {
        rename { "LICENSE_${mod_id}" }
    }
    manifest.attributes(
            'Implementation-Title': mod_name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor': mod_authors,
    )
}
